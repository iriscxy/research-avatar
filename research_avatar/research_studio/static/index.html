<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Research Avatar project control plane">
  <title>Research Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/demo/style.css?v=20260809-fixed-structures">
  <link rel="stylesheet" href="/style.css?v=20260810-typography">
</head>
<body class="research-app">
  <main class="studio-main">
    <nav id="pipeline" class="pipeline" aria-label="Research stages"></nav>

    <section class="project-workspace">
      <section class="stage-surface">
        <div class="artifact-preview">
          <div class="preview-toolbar">
            <div><span>CANONICAL ARTIFACT</span><strong id="preview-title">等待生成</strong></div>
            <a id="preview-open" class="preview-open" target="_blank" hidden>新窗口打开 ↗</a>
          </div>
          <div id="preview-empty" class="preview-empty">
            <span>⌁</span>
            <strong>该步骤尚未生成</strong>
            <small>请在终端运行以下命令</small>
            <code id="preview-command">等待读取命令</code>
          </div>
          <iframe id="preview-frame" title="Artifact preview" sandbox="allow-scripts allow-forms allow-popups allow-downloads" hidden></iframe>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js?v=20260814-copy-goal-bridge"></script>
</body>
</html>
