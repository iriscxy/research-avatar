<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Research Avatar project control plane">
  <title>Research Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/demo/style.css?v=20260809-fixed-structures">
  <link rel="stylesheet" href="/style.css?v=20260827-skill-command-copy">
</head>
<body class="research-app">
  <main class="studio-main">
    <div class="studio-status" aria-label="Project and connection status">
      <span><b>Project</b> <code id="studio-project-id">—</code></span>
      <span><b>Report version</b> <code id="studio-report-version">—</code></span>
      <span><b>Updated</b> <time id="studio-updated-at">—</time></span>
      <span id="studio-connection" class="connection-state">Connecting…</span>
    </div>
    <nav id="pipeline" class="pipeline" aria-label="Research stages"></nav>

    <section class="project-workspace">
      <section class="stage-surface">
        <div class="artifact-preview">
          <div class="preview-toolbar">
            <div><span>CANONICAL ARTIFACT</span><strong id="preview-title">Waiting for output</strong></div>
            <div id="artifact-tabs" class="artifact-tabs" aria-label="Current stage artifacts"></div>
            <a id="preview-open" class="preview-open" target="_blank" hidden>Open in new window ↗</a>
          </div>
          <div id="preview-empty" class="preview-empty">
            <span>⌁</span>
            <strong>This stage has not been generated yet</strong>
            <small>Run the following command in the local terminal</small>
            <div class="preview-command-row">
              <code id="preview-command">Waiting for command</code>
              <button id="preview-command-copy" class="preview-command-copy" type="button" hidden>Copy command</button>
            </div>
            <small id="preview-copy-status" class="preview-copy-status" aria-live="polite"></small>
          </div>
          <iframe id="preview-frame" title="Artifact preview" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" hidden></iframe>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js?v=20260827-skill-command-copy"></script>
</body>
</html>
