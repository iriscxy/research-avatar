<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Online Paper Studio</title>
  <link rel="stylesheet" href="/online-assets/style.css?v=20260819.1">
</head>
<body>
  <main class="shell">
    <section id="auth-card" class="card auth-card">
      <p class="eyebrow">SECURE SIGN IN</p>
      <h1 class="auth-title">登录 Online Paper Studio</h1>
      <p class="lede">登录后，你的资料、项目和写作会话只绑定到当前账户。</p>
      <form id="auth-form">
        <label>邮箱<input name="email" type="email" required autocomplete="email"></label>
        <label>密码<input name="password" type="password" required minlength="6" maxlength="1024" autocomplete="current-password"><small>新账户密码至少 6 个字符。</small></label>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <div class="auth-buttons">
          <button type="submit" data-action="login">登录</button>
          <button type="submit" data-action="signup" class="secondary">注册并登录</button>
        </div>
      </form>
      <div class="divider"><span>或者</span></div>
      <a id="google-login" class="google-login hidden" href="/auth/google/start">使用 Google 账户登录</a>
    </section>

    <div id="workspace-shell" class="hidden">
      <p id="session-notice" class="session-notice hidden" role="status" aria-live="polite"></p>
      <div class="account-bar">
        <span id="account-label"></span>
        <button id="logout" class="link-button" type="button">退出登录</button>
      </div>
      <nav class="product-tabs" aria-label="Online Paper Studio">
        <button id="demo-tab" class="product-tab active" type="button" data-panel="demo-panel" aria-selected="true">Demo</button>
        <button id="use-tab" class="product-tab" type="button" data-panel="use-panel" aria-selected="false">免费纯文字 PaperWrite 版</button>
      </nav>

      <section id="demo-panel" class="product-panel">
        <iframe id="demo-frame" class="demo-frame" src="about:blank" title="Research Avatar complete demo"></iframe>
      </section>

      <section id="use-panel" class="product-panel hidden">
        <div id="session-actions" class="session-actions hidden">
          <button id="resume-studio" class="resume" type="button">继续当前写作会话 →</button>
          <button id="reset-studio" class="secondary" type="button">清空当前内容并重新上传</button>
          <span id="reset-message" role="status" aria-live="polite"></span>
        </div>

        <div id="use-onboarding" class="use-columns">
        <form id="setup-form" class="card unified-setup">
      <div class="setup-heading">
        <p class="step-index">01</p>
        <div><h2>上传论文写作材料</h2><p>只需提交科研项目主旨和结构参考论文。系统分析参考论文的章节与段落逻辑，并为目标论文逐段写作；实验部分写成待执行的实验设计，定量值统一使用 xx；Introduction 默认保留 Motivation 图位，其他计划图表也保留 placeholder，导出后可在本地终端继续完成。</p></div>
      </div>
      <label>目标会议 / 期刊（venue）<input name="venue" required placeholder="例如 ACL 2027、EMNLP 2026 Findings"></label>
      <label>当前工作说明
        <input name="project_brief_file" type="file" accept=".doc,.docx,.txt,.pdf,.md,.markdown,.json,.html,.htm" required>
        <small>说明研究问题、方法、数据、当前进展、预期贡献和限制，让写作 API 明确项目在做什么。</small>
      </label>
      <label>结构参考论文
        <input name="reference_paper_file" type="file" accept=".txt,.pdf,.md,.markdown,.html,.htm" required>
        <small>上传一篇完整论文。系统只模仿它的章节组织和论证推进，不复制其研究主张、数字或措辞。</small>
      </label>
      <p id="message" role="status" aria-live="polite"></p>
      <button id="submit" type="submit">进入 Paper Studio →</button>
      <p class="security">在线写作会话是临时工作区，统一使用共享 DeepSeek API；关闭或超时前请从写作台导出项目 ZIP。</p>
        </form>
        </div>
        <iframe id="studio-frame" class="studio-frame hidden" src="about:blank" title="论文写作界面"></iframe>
      </section>
    </div>
  </main>
  <script src="/online-assets/app.js?v=20260822.1-paperwrite-label" defer></script>
</body>
</html>
