<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Research Buddy interactive product demo">
  <title>Research Buddy · Interactive Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="focused-demo">
  <main>
    <section id="journey" class="journey-section">
      <div class="section-heading">
        <div><p class="eyebrow">RESEARCH WORKFLOW</p><h1>一项研究，五个可审核的阶段</h1></div>
        <p>点击顶部步骤探索完整界面；每个阶段都继承上一阶段批准的合同。</p>
      </div>

      <nav id="journey-nav" class="journey-nav" aria-label="Demo stages"></nav>

      <div class="demo-browser">
        <div class="browser-bar">
          <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="browser-path" class="browser-path">research-buddy-demo.pages.dev/profile</div>
          <span class="safe-state">PUBLIC DEMO</span>
        </div>
        <div class="browser-body">
          <aside class="demo-sidebar">
            <div class="mini-brand"><span>RB</span><strong>Research<br>Buddy</strong></div>
            <div id="stage-summary" class="stage-summary"></div>
            <div class="sidebar-human">
              <span class="avatar">你</span>
              <p><strong>Researcher in control</strong><small>每个关键决定都等待确认</small></p>
            </div>
          </aside>
          <section id="stage-content" class="stage-content" aria-live="polite"></section>
          <aside id="compare-panel" class="compare-panel"></aside>
        </div>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
