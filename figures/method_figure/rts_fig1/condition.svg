<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1260" viewBox="0 0 880 1260"><rect x="0" y="0" width="880" height="1260" rx="0" fill="#FFFFFF"/><text x="56" y="78" fill="#1F2937" font-size="40" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="start">Route-Then-Steer (CRH-in-MoE) Figure 1</text><text x="58" y="110" fill="#6B7280" font-size="17" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">When a concept's per-expert directions disperse (high fragmentation), a residual steer is routed away; biasing the router toward the expressing experts, then steering, makes it land.</text><rect x="90" y="190" width="310" height="610" rx="18" fill="#E5EEFB" stroke="#9DBDEB" stroke-width="2"/><text x="110" y="222" fill="#2563EB" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="start">A · Routing fragmentation (diagnosis)</text><rect x="450" y="190" width="310" height="790" rx="18" fill="#FDEBD8" stroke="#F4C18A" stroke-width="2"/><text x="470" y="222" fill="#EA580C" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="start">B · Route-Then-Steer (fix)</text><line x1="245" y1="398" x2="245" y2="544" stroke="#4B5563" stroke-width="2.6"/><path d="M245,544 L240,534 L250,534 Z" fill="#4B5563"/><rect x="206" y="460" width="77" height="19" rx="4" fill="#FFFFFF"/><text x="245.0" y="474.0" fill="#4B5563" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">collinear</text><line x1="245" y1="398" x2="245" y2="690" stroke="#4B5563" stroke-width="2.6"/><path d="M245,690 L240,680 L250,680 Z" fill="#4B5563"/><rect x="206" y="533" width="77" height="19" rx="4" fill="#FFFFFF"/><text x="245.0" y="547.0" fill="#4B5563" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">dispersed</text><path d="M605,286 Q605,239 605,432" fill="none" stroke="#EA580C" stroke-width="2.6" stroke-dasharray="8 5"/><path d="M605,432 L600,422 L610,422 Z" fill="#EA580C"/><rect x="570" y="228" width="70" height="19" rx="4" fill="#FFFFFF"/><text x="605.0" y="242.0" fill="#EA580C" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">no nudge</text><line x1="605" y1="286" x2="605" y2="578" stroke="#4B5563" stroke-width="2.6"/><path d="M605,578 L600,568 L610,568 Z" fill="#4B5563"/><rect x="594" y="421" width="21" height="19" rx="4" fill="#FFFFFF"/><text x="605.0" y="435.0" fill="#4B5563" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">δ</text><line x1="605" y1="578" x2="605" y2="724" stroke="#4B5563" stroke-width="2.6"/><path d="M605,724 L600,714 L610,714 Z" fill="#4B5563"/><rect x="584" y="640" width="42" height="19" rx="4" fill="#FFFFFF"/><text x="605.0" y="654.0" fill="#4B5563" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">then</text><line x1="605" y1="724" x2="605" y2="870" stroke="#0E9F6E" stroke-width="2.6"/><path d="M605,870 L600,860 L610,860 Z" fill="#0E9F6E"/><rect x="580" y="786" width="49" height="19" rx="4" fill="#FFFFFF"/><text x="605.0" y="800.0" fill="#0E9F6E" font-size="11.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">lands</text><rect x="152" y="236" width="185" height="66" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="245" y="262" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">dense: one direction (LRH/CRH)</text><text x="245" y="284" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">single shared concept direction</text><rect x="120" y="348" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="245" y="391" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">MoE router</text><text x="245" y="413" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">fans token to experts E1..E5</text><rect x="120" y="494" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="245" y="537" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">Frag ≈ 0  (refusal)</text><text x="245" y="559" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">per-expert arrows collinear</text><rect x="120" y="640" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="245" y="683" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">Frag high  (medical / legal)</text><text x="245" y="705" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">per-expert arrows dispersed</text><rect x="480" y="236" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/><text x="605" y="279" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">router (gate)</text><text x="605" y="301" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">token enters the gate</text><rect x="480" y="382" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/><text x="605" y="425" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">✗ routed away</text><text x="605" y="447" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">lambda-v sent to non-expressing experts (grey)</text><rect x="480" y="528" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/><text x="605" y="571" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">(1) route (δ)</text><text x="605" y="593" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">bias router toward expressing experts E_c</text><rect x="480" y="674" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/><text x="605" y="717" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">(2) steer (λ v)</text><text x="605" y="739" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">add residual concept vector</text><rect x="480" y="820" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/><text x="605" y="863" fill="#1F2937" font-size="18" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">✓ steer lands</text><text x="605" y="885" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">reaches expressing experts E_c (teal)</text><rect x="230" y="990" width="420" height="150" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="2.4"/><text x="440" y="1016.0" fill="#DC2626" font-size="17" font-weight="800" font-family="Inter, Arial, sans-serif" text-anchor="middle">A concept's steering direction fragments across experts; route-then-steer makes it land</text><text x="440" y="1042.0" fill="#1F2937" font-size="12.5" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="middle">When a concept's per-expert directions disperse (high fragmentation), a residual steer is routed away; biasing the router toward the expressing experts, then steering, makes it land.</text><text x="440.0" y="1238" fill="#6B7280" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">max 4 rounds | blind cross-model diff | human backstop</text></svg>