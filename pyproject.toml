[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-avatar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.15,<5",
  "matplotlib>=3.9,<4",
  "openai>=3.1,<4",
  "Pillow>=12.3,<13",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.50,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
research-avatar = "tools.research_buddy_cli:main"
# Compatibility alias for clones/scripts created before the project rename.
research-buddy = "tools.research_buddy_cli:main"

[tool.setuptools.packages.find]
include = ["tools*", "paper_studio*", "research_studio*", "demo*", "functions*"]
namespaces = true

[tool.setuptools.package-data]
paper_studio = ["static/*", "*.mjs", "README.md"]
research_studio = ["static/*"]
demo = ["*.html", "*.js", "*.css", "*.json", "_routes.json", "assets/**/*"]
functions = ["*.js"]
